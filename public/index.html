<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <!-- Script Oficial do Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>Desenho Assinado</h1>

    <!-- Botão do Google com o teu Client ID já inserido -->
    <div id="g_id_onload"
         data-client_id="678603567321-qucbvb0fqs333vu9a5q87hrcrde0t8m0.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <!-- Formulário apenas com o campo de número -->
    <form id="form-desenho">
      <label for="numero">Número (1 a 100):</label>
      <input type="number" id="numero" min="1" max="100" required>
      <button type="submit">Gerar Desenho</button>
    </form>

    <div id="mensagem-erro" style="color: red; margin-top: 10px;"></div>
    <div id="container-svg" style="margin-top: 20px;"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
